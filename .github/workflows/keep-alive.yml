name: Keep Supabase Alive

on:
  schedule:
    # Corre cada 3 días a las 8am UTC (3am Perú)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # permite correrlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zlkrcrgenppavmqhnxuh.supabase.co/rest/v1/config?select=clave&limit=1" \
            -H "apikey: sb_publishable_4kXgQK2SUxKmBoQZGoKlhQ_KXTW8HNa")
          echo "Supabase status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Supabase no responde"
            exit 1
          fi
          echo "OK: Supabase activo"
